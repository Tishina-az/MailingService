{% extends 'mailing/base.html' %}

{% block title %}Вход пользователя{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <h3 class="text-center mb-4 mt-3">Вход в личный кабинет:</h3>
        <div class="col-4"></div>
        <div class="col-4">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <div>
                                <button type="submit" class="btn btn-primary me-2">Войти</button>
                                <a href="{% url 'mailing:main_page' %}" class="btn btn-warning">На главную</a>
                            </div>
                            <a href="{% url 'users:password_reset' %}" class="text-decoration-none text-muted small">
                                Забыли пароль?
                            </a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-4"></div>
    </div>
</div>
{% endblock %}
