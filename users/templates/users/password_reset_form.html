{% extends 'mailing/base.html' %}

{% block title %}Сброс пароля{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <h3 class="text-center mb-4 mt-3">Сброс пароля:</h3>
        <div class="col-4"></div>
        <div class="col-4">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="mt-4">
                            <button type="submit" class="btn btn-primary me-4">Отправить ссылку для сброса</button>
                            <a href="{% url 'users:login' %}" class="btn btn-warning">Отмена</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-4"></div>
    </div>
</div>
{% endblock %}
