{% extends 'mailing/base.html' %}

{% block title %}Установка нового пароля{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <h3 class="text-center mb-4 mt-3">
            Установка нового пароля:
        </h3>
        <div class="col-3"></div>
        <div class="col-6">
            <form class="row" method="post" enctype="multipart/form-data">
                <div class="card">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary">Сохранить новый пароль</button>
                        <a href="{% url 'users:login' %}" class="btn btn-warning">Отменить</a>
                    </div>
                </div>
            </form>
        </div>
        <div class="col-3"></div>
    </div>
</div>
{% endblock %}
