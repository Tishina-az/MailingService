<!doctype html>
<html lang="en" class="h-100"> <!-- Добавляем h-100 для html -->
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Сервис рассылки{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body class="d-flex flex-column h-100"> <!-- Растягиваем body на всю высоту -->
    {% include 'mailing/main_menu.html' %}

    <main class="flex-grow-1"> <!-- Основной контент растягивается, выталкивая футер вниз -->
        <div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
            <h1 class="display-4">T-Spam</h1>
            <p class="lead">T-Spam - сервис управления рассылками, администрирования и получения статистики.</p>
        </div>

        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    {% include 'mailing/footer.html' %}
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
