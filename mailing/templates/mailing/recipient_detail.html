{% extends 'mailing/base.html' %}

{% block title %}{{ recipient.full_name|truncatechars:25 }}{% endblock %}

{% block content %}
<div class="position-relative overflow-hidden p-3 p-md-5 m-md-3 text-center bg-body-tertiary">
    <div class="col-md-6 p-lg-5 mx-auto my-5">
        <h1 class="display-3 fw-bold">{{ recipient.full_name }}</h1>
        <a class="link-opacity-75-hover" href="mailto: {{ recipient.email }}">{{ recipient.email }}</a>
        <h3 class="fw-normal text-muted mb-3">{{ recipient.comment }}</h3>
        <div class="d-flex gap-3 justify-content-center lead fw-normal">
            <a class="icon-link" href="{% url 'mailing:recipient_list' %}">
                К списку получателей
                <svg class="bi"><use xlink:href="#chevron-right"/></svg>
            </a>
            <a class="icon-link" href="{% url 'mailing:recipient_update' recipient.pk %}">
                Редактировать
                <svg class="bi"><use xlink:href="#chevron-right"/></svg>
            </a>
            <a class="icon-link" href="{% url 'mailing:recipient_delete' recipient.pk %}">
                Удалить
                <svg class="bi"><use xlink:href="#chevron-right"/></svg>
            </a>
        </div>
    </div>
    <div class="product-device shadow-sm d-none d-md-block"></div>
    <div class="product-device product-device-2 shadow-sm d-none d-md-block"></div>
</div>
{% endblock %}
