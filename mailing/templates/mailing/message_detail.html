{% extends 'mailing/base.html' %}

{% block title %}Детали сообщения{% endblock %}

{% block content %}
<div class="position-relative overflow-hidden p-3 p-md-5 m-md-3 text-center bg-body-tertiary">
    <div class="col-md-8 p-lg-5 mx-auto my-5">
        <h1 class="display-3 fw-bold mb-5">{{ message.subject }}</h1>
        <h3 class="fw-normal text-muted mb-3">{{ message.body|safe }}</h3>  <!-- HTML-контент рендерится корректно -->
        <div class="d-flex gap-3 justify-content-center lead fw-normal mt-5">
            <a class="icon-link" href="{% url 'mailing:message_list' %}">
                К списку сообщений
                <svg class="bi"><use xlink:href="#chevron-right"/></svg>
            </a>
            <a class="icon-link" href="{% url 'mailing:message_update' message.pk %}">
                Редактировать
                <svg class="bi"><use xlink:href="#chevron-right"/></svg>
            </a>
            <a class="icon-link" href="{% url 'mailing:message_delete' message.pk %}">
                Удалить
                <svg class="bi"><use xlink:href="#chevron-right"/></svg>
            </a>
        </div>
    </div>
    <div class="product-device shadow-sm d-none d-md-block"></div>
    <div class="product-device product-device-2 shadow-sm d-none d-md-block"></div>
</div>
{% endblock %}
